name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit tests use the app as TEST_HOST and the deployment target is macOS 26,
    # so they must execute on a Tahoe (macOS 26) runner.
    runs-on: macos-26
    # contents: write for the coverage-badge push to gh-pages.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run tests
        run: |
          xcodebuild test \
            -project Orchard.xcodeproj \
            -scheme Orchard \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults

      # Coverage is scoped to Orchard/Services/ — views are deliberately untested, so a
      # whole-app number would read as neglect. Informational only, not a gate.
      - name: Compute services coverage
        run: |
          mkdir -p badge
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 - <<'EOF'
          import json
          r = json.load(open("coverage.json"))
          files = [f for t in r["targets"] for f in t.get("files", [])
                   if "/Orchard/Services/" in f["path"]]
          covered = sum(f["coveredLines"] for f in files)
          total = sum(f["executableLines"] for f in files)
          pct = round(100 * covered / total) if total else 0
          json.dump({"schemaVersion": 1, "label": "services coverage",
                     "message": f"{pct}%", "color": "e8590c"},
                    open("badge/coverage-badge.json", "w"))
          print(f"services coverage: {pct}% ({covered}/{total} lines)")
          EOF

      # Persist the badge JSON on gh-pages (the data store for generated files).
      # keep_files preserves appcast.xml; the deploy job below publishes the assembled
      # site (site/ + badge + appcast) via the Actions Pages path.
      - name: Persist coverage badge to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge
          keep_files: true

  # XCUITest smoke suite — launches the app against the stubbed backend
  # (--uitest-mock-backend) and drives a few flows. Separate job so the unit-test signal
  # stays fast; needs a real macOS GUI session (the macos-26 runner provides one).
  ui-test:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run UI smoke tests
        run: |
          # UI smoke tests intermittently fail to attach / find the sidebar on a cold CI
          # runner (accessibility tree slow to populate after a fresh app launch). Retry
          # failed tests a few times so a transient miss doesn't fail the job; a test only
          # fails if it misses on every attempt.
          xcodebuild test \
            -project Orchard.xcodeproj \
            -scheme OrchardUITests \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipPackagePluginValidation \
            -resultBundlePath UITestResults \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-results
          path: UITestResults

  # Publish the site (with the freshly-persisted badge) via GitHub Actions Pages.
  deploy-pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
